services:
  google-ads-mcp:
    build: .
    container_name: google-ads-mcp
    restart: unless-stopped
    hostname: google-ads-mcp
    environment:
      FASTMCP_HOST: ${FASTMCP_HOST}
      GOOGLE_PROJECT_ID: ${GOOGLE_PROJECT_ID}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${GOOGLE_ADS_DEVELOPER_TOKEN}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${GOOGLE_ADS_LOGIN_CUSTOMER_ID}
      GOOGLE_ADS_MCP_OAUTH_CLIENT_ID: ${GOOGLE_ADS_MCP_OAUTH_CLIENT_ID}
      GOOGLE_ADS_MCP_OAUTH_CLIENT_SECRET: ${GOOGLE_ADS_MCP_OAUTH_CLIENT_SECRET}
      GOOGLE_ADS_MCP_BASE_URL: ${GOOGLE_ADS_MCP_BASE_URL}
      GOOGLE_ADS_MCP_JWT_SIGNING_KEY: ${GOOGLE_ADS_MCP_JWT_SIGNING_KEY}
      GOOGLE_ADS_MCP_STORAGE_TYPE: ${GOOGLE_ADS_MCP_STORAGE_TYPE}
      GOOGLE_ADS_MCP_STORAGE_PATH: ${GOOGLE_ADS_MCP_STORAGE_PATH}
      GOOGLE_ADS_MCP_STORAGE_ENCRYPTION_KEY: ${GOOGLE_ADS_MCP_STORAGE_ENCRYPTION_KEY}
    volumes:
      - oauth-state:/data/oauth
    networks:
      - nginx

volumes:
  oauth-state:

networks:
  nginx:
    external: true